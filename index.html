 const rows=S.teachers.map(t=>({t,s:stats(t,P.a,P.b)})),T=rows.reduce((a,r)=>{for(const k in r.s)a[k]=(a[k]||0)+r.s[k];return a},{}),cf=confl();

function initCloud(){
 if(!window.firebase||FB.apiKey==="YOUR_API_KEY"){const o=document.getElementById("lg");if(o)o.remove();return}
 firebase.initializeApp(FB);auth=firebase.auth();const db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});ref=db.doc("school/main");
 const ov=document.getElementById("lg"),lo=document.getElementById("lo");
 document.getElementById("gb").onclick=()=>{const p=new firebase.auth.GoogleAuthProvider(),le=document.getElementById("le");p.setCustomParameters({prompt:"select_account"});le.textContent="";auth.signInWithPopup(p).catch(e=>{if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")auth.signInWithRedirect(p);else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")le.textContent="تعذر الدخول. تأكد من تفعيل Google وإضافة النطاق في Firebase."})};
 lo.onclick=()=>auth.signOut();let un=null;
 auth.onAuthStateChanged(u=>{if(un){un();un=null}
  if(!u){ov.style.display="flex";lo.style.display="none";return}
  ov.style.display="none";lo.style.display="block";
  un=ref.onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;
   if(!s.exists){if(!s.metadata.fromCache)ref.set(JSON.parse(JSON.stringify(S)));return}
   S=Object.assign({name:"",teachers:[],slots:{},abs:[],mk:[],hol:[]},s.data());
   try{localStorage.setItem("school-v2",JSON.stringify(S))}catch(e){}
   const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest("main")))render()},er=>{const d=er&&er.code==="permission-denied";toast(d?"هذا الحساب غير مسموح له بالدخول":"تعذر الاتصال بقاعدة البيانات");if(d){document.getElementById("le").textContent="هذا الحساب غير مسموح له بالدخول";auth.signOut()}})})}
